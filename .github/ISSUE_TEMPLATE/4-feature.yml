name: Feature request
description: Suggest something the app should do
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the shopping problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This works with the APIs the app already calls, as far as I know
