name: Wrong or missing results
description: The extension found nothing, or the ordering looks wrong
labels: ['results']
body:
  - type: markdown
    attributes:
      value: |
        Prices, discounts and delivery fees are personalised and time-limited, so
        please include what you searched and what you expected to see instead.
  - type: input
    id: query
    attributes:
      label: What did you search for?
      placeholder: پفک مینو
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Sort mode
      options:
        - بیشترین تخفیف ← پرو ← کمترین ارسال (default)
        - کمترین هزینه کل (کالا + ارسال)
        - کمترین هزینه ارسال
    validations:
      required: true
  - type: checkboxes
    id: filters
    attributes:
      label: Filters that were on
      options:
        - label: فقط تخفیف کمپینی
        - label: فقط فروشگاه باز
        - label: Signed in to snapp.market in another tab
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: The store and price you saw in the app or on the website, if you have it.
    validations:
      required: true
  - type: input
    id: status
    attributes:
      label: The status line at the bottom of the popup
      placeholder: ۴۵ فروشگاه اطراف · ۱۰۹ پیشنهاد · حساب اسنپ‌مارکت متصل
