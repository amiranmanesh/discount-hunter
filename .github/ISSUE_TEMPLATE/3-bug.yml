name: Bug
description: Something in the app itself is broken
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari 18 / Chrome 151 on macOS
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or image tag
      placeholder: 2.0.0 / ghcr.io/…:latest
  - type: textarea
    id: console
    attributes:
      label: Console output
      render: text
