name: Bug
description: Something in the extension itself is broken
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 151
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: |
        Errors from the popup (right-click the popup → Inspect) and from the
        service worker (chrome://extensions → Service worker).
      render: text
