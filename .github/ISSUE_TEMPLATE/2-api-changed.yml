name: An endpoint changed
description: A Snapp Market or Digikala Jet API stopped answering the way the app expects
labels: ['api']
body:
  - type: markdown
    attributes:
      value: |
        These are undocumented APIs and they change without notice.
        [`docs/API.md`](../../blob/main/docs/API.md) records the shapes the app
        relies on.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Snapp Market, Digikala Jet]
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Endpoint
      placeholder: GET /api/snapp/market-party/{vendorCode}
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: What the app showed, and what the response looked like
      description: Strip the `Authorization` header before pasting — it identifies your account.
      render: text
    validations:
      required: true
