name: CI

# Pushes to main are verified by the release workflow, which then publishes; this
# one covers everything before a merge.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Generated from committed source with no native dependencies, so a diff
      # here means someone edited the output instead of the generator.
      - name: Verify the icons are reproducible
        run: |
          npm run icons
          git diff --exit-code -- public/icons

  image:
    name: Build the Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # Built but not pushed: a pull request should prove the image still builds
      # without publishing anything.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: discount-hunter:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot it, then check the app and the proxy
        run: |
          docker run -d --name check -p 3000:3000 discount-hunter:pr
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "healthy after ${i}s"
              break
            fi
            if [ "$i" = 30 ]; then
              echo "the container never became healthy" >&2
              docker logs check
              exit 1
            fi
            sleep 1
          done

          # The page renders...
          curl -fsS http://localhost:3000/ | grep -q 'dir="rtl"'

          # ...and the proxy route is mounted. It is answered by the handler,
          # not by Next.js's own 404 page, which is what the message proves.
          # The upstreams themselves are not called here: they refuse traffic
          # from outside Iran, so a CI runner cannot tell a blocked request
          # apart from a broken one.
          curl -s http://localhost:3000/api/unknown-platform/whatever \
            | grep -q 'سرویس ناشناخته'

          docker rm -f check
