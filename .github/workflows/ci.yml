name: CI

# Pushes to main are verified by the release workflow, which then publishes; this
# one covers everything before a merge.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Generated from committed source with no native dependencies, so a diff
      # here means someone edited the output instead of the generator.
      - name: Verify the icons are reproducible
        run: |
          npm run icons
          git diff --exit-code -- public/icons

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 14

  image:
    name: Build the Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: a pull request should prove the image still builds
      # without publishing anything.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: discount-hunter:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot it and check /healthz
        run: |
          docker run -d --name check -p 4173:4173 discount-hunter:pr
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:4173/healthz > /dev/null; then
              echo "healthy after ${i}s"
              curl -fsS http://localhost:4173/ | head -c 120
              docker rm -f check
              exit 0
            fi
            sleep 1
          done
          echo "the container never became healthy" >&2
          docker logs check
          exit 1
