name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Generated from committed source with no native dependencies, so a diff
      # here means someone edited the output instead of the generator.
      - name: Verify the icons are reproducible
        run: |
          npm run icons
          git diff --exit-code -- public/icons

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 14
