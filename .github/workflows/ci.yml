name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build every target
        run: npm run build

      # Both are generated from committed source with no native dependencies, so
      # a diff here means someone edited the output instead of the generator.
      - name: Verify the manifest is in sync
        run: |
          npm run manifest
          git diff --exit-code -- extension/manifest.json

      - name: Verify the icons are reproducible
        run: |
          npm run icons
          git diff --exit-code -- public/icons extension/icons

      - uses: actions/upload-artifact@v4
        with:
          name: unpacked-extensions
          path: dist/
          retention-days: 14

  addon-lint:
    name: web-ext lint (Firefox)
    runs-on: ubuntu-latest
    # Advisory: AMO's linter is stricter than the store's own review bar and its
    # warnings change between releases, so it must not gate a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build:firefox
      - run: npx --yes web-ext lint --source-dir dist/firefox --warnings-as-errors=false
