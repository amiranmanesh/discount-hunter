name: Wiki

# The GitHub wiki is its own git repository. Keeping the pages in `wiki/` means
# they are reviewed in pull requests like the rest of the docs, and this job
# mirrors them across on merge.
on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Mirror wiki/ into the GitHub wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Clone the wiki repository
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki-repo

      - name: Copy the pages across
        run: |
          find wiki-repo -maxdepth 1 -name '*.md' -delete
          cp wiki/*.md wiki-repo/

      - name: Commit and push
        working-directory: wiki-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
            exit 0
          fi
          git commit -m "docs(wiki): sync from ${GITHUB_SHA:0:7}"
          git push
