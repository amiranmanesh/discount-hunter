name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the package without publishing it
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package:
    name: Build and publish the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify
        run: npm run verify

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release/

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

      # Skipped entirely until the matching secrets exist, so the workflow is
      # safe to run in a fork or before the first store submission.
      - name: Publish to the Chrome Web Store
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          inputs.dry_run != true &&
          env.CHROME_CLIENT_ID != ''
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          version="$(node -p "require('./package.json').version")"
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source "release/discount-hunter-$version-chrome.zip" \
            --extension-id "$CHROME_EXTENSION_ID" \
            --client-id "$CHROME_CLIENT_ID" \
            --client-secret "$CHROME_CLIENT_SECRET" \
            --refresh-token "$CHROME_REFRESH_TOKEN"
