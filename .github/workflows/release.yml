name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build and attach the bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify
        run: npm run verify

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # The bundle needs the server beside it: the two shopping APIs refuse
      # cross-origin browser requests, so the app cannot be hosted as static
      # files on someone else's domain.
      - name: Package the deployable bundle
        run: |
          mkdir -p release
          tar -czf "release/discount-hunter-${GITHUB_REF_NAME#v}.tar.gz" \
            dist server package.json package-lock.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release/

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
