name: Release

# Push to main and the latest version is built, published and released.
#
# The version comes from package.json, so a release is a deliberate act — bump
# the version in the same commit and it ships; leave it and the push only
# refreshes `:main` and `:sha`.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image and cut the release
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      released: ${{ steps.meta.outputs.released }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run verify

      - name: Read the version and check whether it is already released
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already tagged; this push refreshes the image only."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "v$version is new; it will be tagged and released."
          fi

      - name: Check a pushed tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 14

  image:
    name: Build and publish the image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.verify.outputs.version }},enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Tag and release
    needs: [verify, image]
    # Only when package.json carries a version that has never been released.
    if: needs.verify.outputs.released == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Bundle the deployable files
        run: |
          mkdir -p release
          tar -czf "release/discount-hunter-${{ needs.verify.outputs.version }}.tar.gz" \
            dist server package.json
          (cd release && sha256sum *.tar.gz > checksums.txt)

      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.verify.outputs.version }}" -m "v${{ needs.verify.outputs.version }}"
          git push origin "v${{ needs.verify.outputs.version }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: v${{ needs.verify.outputs.version }}
          generate_release_notes: true
          files: release/*
          body: |
            ```bash
            docker run -p 4173:4173 ghcr.io/${{ github.repository }}:${{ needs.verify.outputs.version }}
            ```

            The tarball holds `dist/` and `server/`; run it with
            `node server/index.mjs`. The app has to be served next to its proxy —
            see `docs/ARCHITECTURE.md`.
