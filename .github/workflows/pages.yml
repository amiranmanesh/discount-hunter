name: Pages

# Builds the app itself and deploys it to GitHub Pages.
#
# Pages is a static host, and none of the three shopping APIs allows a
# cross-origin browser request, so the deployed app needs a proxy it is allowed
# to talk to. `PAGES_API_BASE` says where that is — a Cloudflare Worker on the
# same domain, or one on its own origin. Without it the build still deploys, and
# the app says plainly that it has no API to reach. See docs/HOSTING.md.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'site/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v6
        id: pages

      # Publishing the app only makes sense once it has a proxy to talk to: a
      # static build with no `PAGES_API_BASE` would load and then fail on every
      # request. Until the variable is set, Pages keeps serving the project page.
      - name: Decide what to publish
        id: what
        run: |
          if [ -n "${{ vars.PAGES_API_BASE }}" ]; then
            echo "target=app" >> "$GITHUB_OUTPUT"
          else
            echo "target=site" >> "$GITHUB_OUTPUT"
            echo "::notice::PAGES_API_BASE is not set, so the project page is published rather than the app. See docs/HOSTING.md."
          fi

      - name: Build the app
        if: steps.what.outputs.target == 'app'
        env:
          # A project site is served from `/<repo>/`; a custom domain from the
          # root. `configure-pages` works out which, and the base path has to
          # match or the bundle and the service worker 404.
          VITE_BASE: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/' }}
          VITE_API_BASE: ${{ vars.PAGES_API_BASE }}
        run: |
          npm run build
          # The project page keeps its own URL under /about/.
          mkdir -p dist/about
          cp -r site/* dist/about/
          # Pages serves 404.html for unknown paths; the app is a single page.
          cp dist/index.html dist/404.html

      - name: Or just the project page
        if: steps.what.outputs.target == 'site'
        run: |
          rm -rf dist
          cp -r site dist
          cp public/icons/icon-128.png public/icons/icon-512.png dist/assets/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
